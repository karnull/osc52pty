name: release

# runs only for commits already on master, so pull requests never reach the write permission below
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  # a release in progress always finishes; the next push waits its turn
  cancel-in-progress: false

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: 1.26.9
  # renovate: datasource=github-releases depName=cli/cli
  GH_VERSION: v2.102.0

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH"
            exit 1
          fi
          # exit code 2 means no matching tag; anything else non-zero is a real failure
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null && rc=0 || rc=$?
          case $rc in
            0) release=false ;;
            2) release=true ;;
            *) exit "$rc" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "v$version: release=$release"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...
      - name: build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            name="osc52pty-v$VERSION-darwin-$arch"
            mkdir "$name"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$name/osc52pty" .
            cp LICENSE README.md "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      # creates the tag and the release; this job never checks out or runs the repository's code
      contents: write
      # reads the merged pull request's description for the release notes
      pull-requests: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: install gh
        run: |
          base="https://github.com/cli/cli/releases/download/$GH_VERSION"
          file="gh_${GH_VERSION#v}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gh"
          cd "$RUNNER_TEMP/gh"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/gh_${GH_VERSION#v}_checksums.txt"
          grep " $file\$" "gh_${GH_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" --strip-components=1
          echo "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"
      - name: release notes
        run: |
          gh --version
          # the bullet points of the pull request that was merged, or of the commit when pushed directly
          body=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].body // ""')
          if [ -z "$body" ]; then
            body=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message')
          fi
          printf '%s\n' "$body" | tr -d '\r' | grep -E '^[[:space:]]*[*-] ' > notes.md || true
          if [ ! -s notes.md ]; then
            echo "* osc52pty v$VERSION" > notes.md
          fi
          cat notes.md
      - name: release
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
